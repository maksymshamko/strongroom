upstream strongroom_web {
    server 127.0.0.1:3400;
    keepalive 16;
}

upstream strongroom_api {
    server 127.0.0.1:3401;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name strongroom.shamko.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- apex: web + api -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name strongroom.shamko.me;

    ssl_certificate     /etc/letsencrypt/live/strongroom.shamko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strongroom.shamko.me/privkey.pem;

    # §4.4 — above the app's 10 MB cap, so an oversized upload gets the
    # app's playful FILE_TOO_LARGE and not a bare nginx 413.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";

    # Long enough for a large signed-URL round trip, short enough to fail loudly.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # --- API ----------------------------------------------------------
    # Note the trailing-slash asymmetry is deliberate: the API already serves
    # its own /api/v1 prefix, so the path is passed through untouched.
    location /api/v1/ {
        proxy_pass http://strongroom_api;
    }

    location = /api/v1/health {
        proxy_pass http://strongroom_api;
        access_log off;
    }

    # --- Web ----------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://strongroom_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A public share token IS the credential, so the URL that carries it must
    # not be written to disk. This block is matched before `location /`.
    location ^~ /s/ {
        proxy_pass http://strongroom_web;
        access_log off;
    }

    location ^~ /api/v1/public/ {
        proxy_pass http://strongroom_api;
        access_log off;
    }

    location / {
        proxy_pass http://strongroom_web;
    }

    access_log /var/log/nginx/strongroom.access.log;
    error_log  /var/log/nginx/strongroom.error.log warn;
}